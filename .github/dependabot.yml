# Keep dependencies current with weekly Dependabot PRs. The CI workflow (compile + test) gates
# every PR, so a bad bump is caught before merge. Low-risk minor/patch bumps are grouped into a
# single PR each to keep the noise down; majors still arrive as their own PRs for a proper look.
#
# The server's runtime dep @paul80nd/rcasm lives on GitHub Packages (private registry). The
# `registries` block below lets Dependabot authenticate; it is attached only to the /server
# update, the sole tree that pulls from it. Dependabot also needs to know which scope that
# registry serves — that mapping lives in the committed server/.npmrc (@paul80nd:registry=...),
# without which file fetching aborts with "Private npm registries require ... a .npmrc file".
version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
updates:
  # Root manifest and the two nested workspaces (client/, server/) are separate package.json
  # trees, so each needs its own Dependabot entry.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the Node major we actually run on (24, per the CI matrix) — bumped in
      # lockstep with the runtime, not on Dependabot's schedule. Minor/patch within it still flow.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/vscode is pinned to the minimum VS Code version we support (engines.vscode);
      # raising it silently raises that minimum, so it moves deliberately, not on schedule.
      - dependency-name: "@types/vscode"
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/server"
    registries:
      - github-packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
