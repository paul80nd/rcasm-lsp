# Keep dependencies current with weekly Dependabot PRs. The CI workflow (compile + test) gates
# every PR, so a bad bump is caught before merge. Low-risk minor/patch bumps are grouped into a
# single PR each to keep the noise down; majors still arrive as their own PRs for a proper look.
#
# The server's runtime dep @paul80nd/rcasm lives on GitHub Packages, which needs a token even to
# read. Dependabot uses its own GITHUB_TOKEN for that (no PAT): the package grants this repo Read
# under "Manage Actions access". There is deliberately no `registries` block — explicit registry
# credentials would take precedence over that built-in token. Dependabot still needs to know which
# scope the registry serves; that mapping lives in the committed server/.npmrc
# (@paul80nd:registry=...), without which file fetching aborts with "Private npm registries
# require ... a .npmrc file".
version: 2
updates:
  # Root manifest and the two nested workspaces (client/, server/) are separate package.json
  # trees, so each needs its own Dependabot entry.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the Node major we actually run on (24, per the CI matrix) — bumped in
      # lockstep with the runtime, not on Dependabot's schedule. Minor/patch within it still flow.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ts-jest (up to 29.4.15) peers on typescript <7, so a TS 7 bump fails `npm ci` with
      # ERESOLVE. Lift this once ts-jest widens its peer range (or we move off ts-jest).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: '/client'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/vscode is pinned to the minimum VS Code version we support (engines.vscode);
      # raising it silently raises that minimum, so it moves deliberately, not on schedule.
      - dependency-name: '@types/vscode'
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: '/server'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
