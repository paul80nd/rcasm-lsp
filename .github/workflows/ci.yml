# Clean install of node dependencies, build the source, and run the unit tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI
permissions:
  contents: read
  # The server's runtime dep @paul80nd/rcasm is hosted on GitHub Packages, which
  # requires authentication even to read; grant the workflow token package reads.
  packages: read

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# One run per ref; a newer push/commit cancels an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # Map the @paul80nd scope to GitHub Packages and write an .npmrc that
          # reads the token from NODE_AUTH_TOKEN below.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@paul80nd'
      - run: npm ci
        # postinstall cascades into client/ and server/ installs; the env is
        # inherited by those child npm invocations so the token reaches them too.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Formatting gate — Prettier is not otherwise enforced, so check it here to
      # stop the repo drifting out of style. Runs before the build to fail fast.
      - run: npx prettier --check .
      # tsc -b is incremental; a stale buildinfo can mask errors, so clear it first.
      - name: Clear stale build info
        run: find . -name '*.tsbuildinfo' -not -path '*/node_modules/*' -delete
      - run: npm run compile
      - run: npm test
      # The browser server bundle is built by esbuild independently of `tsc -b`, so a
      # break here slips past the compile step above; build it to gate that path too.
      - run: npm run esbuild:prd
